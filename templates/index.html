<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ASL Detection</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        body{

            margin:0;
            padding:0;

            background: linear-gradient(
                135deg,
                #0f172a,
                #111827,
                #1e293b
            );

            color:white;

            overflow:hidden;

            font-family: 'Poppins', sans-serif;
        }

        .main-wrapper{

            height:100vh;

            display:flex;

            flex-direction:column;

            padding:15px;
        }

        .top-section{

            flex:1;

            display:flex;

            gap:20px;

            min-height:0;
        }

        .camera-section{

            flex:1.4;

            background: rgba(17,24,39,.85);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,.35);
            transition: .3s ease;

            border-radius:20px;

            overflow:hidden;

            border:3px solid #7c3aed;

            display:flex;

            align-items:center;

            justify-content:center;
        }

        .camera-section,
        .sign-section{
            transform: translateY(0);
        }

        .camera-section:hover,
        .sign-section:hover{
            transform: translateY(-4px);
        }

        video{

            width:100%;
            height:100%;
            object-fit:cover;
        }

        .sign-section{

            flex:1;

            background: rgba(17,24,39,.85);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,.35);
            transition: .3s ease;

            border-radius:20px;

            border:3px solid #2563eb;

            display:flex;

            align-items:center;

            justify-content:center;

            overflow:hidden;
        }

        .sign-section img{

            width:100%;
            height:100%;
            object-fit:contain;
        }

        .bottom-section{

            margin-top:15px;

            background: rgba(17,24,39,.85);

            backdrop-filter: blur(10px);

            border-radius:20px;

            padding:20px;

            box-shadow: 0 10px 30px rgba(0,0,0,.3);
        }

        .title{

            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: .5px;
            text-shadow:
                0 0 20px rgba(56,189,248,.4);

            margin-bottom:5px;

            text-align:center;

            color:#38bdf8;
        }

        .subtitle{
            text-align: center;
            color: #94a3b8;
            margin-top: -10px;
            margin-bottom: 15px;
        }

        .letter{

            font-size:2rem;

            font-weight:bold;

            color:#4ade80;
        }

        .word{

            font-size:1.8rem;

            font-weight:bold;

            color:#facc15;
        }

        .controls{

            margin-top:15px;
        }

        .controls button{

            margin:5px;

            border-radius:12px;

            padding:10px 18px;

            font-weight:bold;

            transition: .25s ease;
            box-shadow: 0 4px 12px rgba(0,0,0,.25);
        }

        .controls button:hover{
            transform:
                translateY(-2px)
                scale(1.03);
        }

        @media(max-width:900px){

            body{
                overflow:auto;
            }

            .main-wrapper{
                height:auto;
            }

            .top-section{

                flex-direction:column;
            }

            .camera-section{
                height:45vh;
            }

            .sign-section{
                height:35vh;
            }

            .letter{
                font-size:1.4rem;
            }

            .word{
                font-size:1.3rem;
            }

            .controls button{
                width:100%;
            }
        }

    </style>

</head>

<body>

    <div class="main-wrapper">

        <div class="title">
            🖐 American Sign Language Detection
        </div>

        <p class="subtitle">
            Real-Time Sign Language Recognition System
        </p>

        <div class="top-section">

            <div class="camera-section">

                <video
                    id="video"
                    autoplay
                    playsinline
                    muted
                ></video>

            </div>

            <div class="sign-section">

                <img
                    src="{{ url_for('static', filename='Images/Sign.jpg') }}"
                    alt="Signs"
                >

            </div>

        </div>

        <div class="bottom-section text-center">

            <div class="letter">

                Detected Letter :
                <span id="detectedLetter">
                    Waiting...
                </span>

            </div>

            <div class="word mt-3">

                Recognized Word :
                <span id="displayWord">
                    ...
                </span>

            </div>

            <div class="controls">

                <button
                    onclick="addLetter()"
                    class="btn btn-success"
                    aria-label="Add Letter"
                >
                    Add Letter
                </button>

                <button
                    onclick="undoLetter()"
                    class="btn btn-warning"
                    aria-label="Undo Letter"
                >
                    Undo
                </button>

                <button
                    onclick="resetWord()"
                    class="btn btn-danger"
                    aria-label="Reset Word"
                >
                    Reset
                </button>

                <button
                    onclick="speakWord()"
                    class="btn btn-info"
                    aria-label="Speak Word"
                >
                    Speak
                </button>

            </div>

        </div>

    </div>

    <canvas
        id="canvas"
        style="display:none;"
    ></canvas>

    <script>

        const video =
            document.getElementById('video');

        const canvas =
            document.getElementById('canvas');

        const detectedLetter =
            document.getElementById('detectedLetter');


        async function startCamera(){

            try{

                const stream =
                    await navigator.mediaDevices.getUserMedia({
                        video:true
                    });

                video.srcObject = stream;

            }catch(error){

                console.log(error);

                alert(
                    "Camera access denied"
                );
            }
        }


        async function predictFrame(){

            if(video.videoWidth === 0){
                return;
            }

            canvas.width = video.videoWidth;

            canvas.height = video.videoHeight;

            const ctx =
                canvas.getContext('2d');

            ctx.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );

            const image =
                canvas.toDataURL('image/jpeg');

            const response =
                await fetch('/predict',{

                    method:'POST',

                    headers:{
                        'Content-Type':'application/json'
                    },

                    body:JSON.stringify({
                        image:image
                    })

                });

            const data =
                await response.json();

            if(data.success){

                detectedLetter.textContent =
                    `${data.letter} (${Math.round(data.confidence * 100)}%)`;

                document.getElementById(
                    'displayWord'
                ).textContent = data.word;

            }
        }


        function updateWord(){

            fetch('/get_word')
                .then(res => res.json())
                .then(data => {

                    document.getElementById(
                        'displayWord'
                    ).textContent = data.word;

                });
        }


        function addLetter(){

            fetch('/add_letter',{
                method:'POST'
            }).then(updateWord);
        }


        function undoLetter(){

            fetch('/undo_letter',{
                method:'POST'
            }).then(updateWord);
        }


        function resetWord(){

            fetch('/reset',{
                method:'POST'
            }).then(updateWord);
        }


        function speakWord(){

            fetch('/get_word')
                .then(res => res.json())
                .then(data => {

                    const msg =
                        new SpeechSynthesisUtterance(
                            data.word
                        );

                    window.speechSynthesis.speak(msg);

                });
        }


        document.addEventListener(
            'keydown',
            function(event){

                const key =
                    event.key.toLowerCase();

                if(key === 'a') addLetter();

                if(key === 'u') undoLetter();

                if(key === 'r') resetWord();

                if(key === 's') speakWord();

            }
        );


        startCamera();

        setInterval(predictFrame, 700);

        setInterval(updateWord, 1000);

    </script>

</body>

</html>
